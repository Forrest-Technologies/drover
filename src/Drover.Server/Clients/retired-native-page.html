<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- An app installed from /native/ starts here. Two seconds on this page let the browser read the manifest below,
         which keeps the app's identity and moves its start and scope to the root, so it opens there in its own window
         from then on. Then the page moves itself to the root. -->
    <meta http-equiv="refresh" content="2;url=/" />
    <title>Drover</title>
    <link rel="manifest" href="/native/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/boot.css" />
</head>
<body>
    <main>
        <h1>Drover has a new address on this server</h1>
        <p>Opening it now.</p>
        <p><a href="/">Open Drover</a></p>
    </main>
</body>
</html>
