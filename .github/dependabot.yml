version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # Wait a week before taking a new release, so a bad publish is caught by others first.
      default-days: 7
      exclude:
        # The agent framework is tracked at its latest release on purpose. The conformance suite is the gate.
        - "Microsoft.Agents.*"
        - "Microsoft.Extensions.AI*"
        - "ModelContextProtocol*"
    groups:
      agent-framework:
        patterns: ["Microsoft.Agents.*", "Microsoft.Extensions.AI*", "ModelContextProtocol*"]
      microsoft:
        patterns: ["Microsoft.*", "System.*", "Npgsql*"]
        exclude-patterns: ["Microsoft.Agents.*", "Microsoft.Extensions.AI*"]
    ignore:
      # Stay on the .NET 10 LTS line.
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Http*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
