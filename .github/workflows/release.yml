# Trusted job: it runs only for version tags, which only maintainers can push (tag ruleset "v*"), and it waits for
# the required reviewer of the "release" environment. It is trusted because of those two controls, not because of
# where it runs. It never executes pull request code, and it runs on a GitHub-hosted runner like every workflow here.
# The project publishes no container images. A release is a tag, a source archive, an SBOM, and attestations.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  release:
    name: SBOM, attest, publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must point at a commit on main
        run: |
          git fetch origin main --depth=200
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore and build
        run: |
          dotnet restore Drover.slnx
          dotnet build Drover.slnx --no-restore -c Release -warnaserror
      - name: Test
        run: dotnet test --solution Drover.slnx --no-build -c Release
      - name: Software bill of materials (CycloneDX)
        run: |
          dotnet tool restore
          dotnet tool run dotnet-CycloneDX Drover.slnx --output artifacts/sbom --filename "drover-${GITHUB_REF_NAME}.cdx.json" --json
      - name: Source archive
        run: git archive --format=tar.gz --prefix="drover-${GITHUB_REF_NAME}/" -o "artifacts/drover-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_SHA"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/drover-*.tar.gz
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: artifacts/drover-*.tar.gz
          sbom-path: artifacts/sbom/drover-${{ github.ref_name }}.cdx.json
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" artifacts/drover-*.tar.gz artifacts/sbom/*.cdx.json --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
