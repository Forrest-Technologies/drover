# Manual runs produce unsigned artifacts only. Protected version tags enter the release environment, where
# complete secret sets enable signing. Missing secret sets keep the package and its filename explicitly unsigned.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in 1.2.3 or 1.2.3-preview.1 form
        required: true
        default: 0.1.0
        type: string
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  metadata:
    name: Check release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and source
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_TYPE" == tag ]]; then
            echo "::error::Choose a branch or commit for a manual dry run."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?)$ ]]; then
              echo "::error::Use a tag like v1.2.3 or v1.2.3-preview.1."
              exit 1
            fi
            version=${BASH_REMATCH[1]}
            git fetch origin main --depth=200
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            version=$REQUESTED_VERSION
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]; then
              echo "::error::The version must have the form 1.2.3 or 1.2.3-preview.1."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-* ]] && channel=preview || channel=stable
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  source:
    name: Source, SBOM and tests
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write # obtain the identity token for source attestations
      attestations: write # write source and SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore, build, format and test
        run: |
          dotnet restore Drover.slnx
          dotnet build Drover.slnx --no-restore -c Release -warnaserror
          dotnet format Drover.slnx --no-restore --verify-no-changes
          dotnet test --solution Drover.slnx --no-build -c Release
      - name: Build source artifacts
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p artifacts/source artifacts/sbom
          dotnet tool restore
          dotnet tool run dotnet-CycloneDX Drover.slnx --output artifacts/sbom --filename "drover-v$VERSION.cdx.json" --json
          git archive --format=tar.gz --prefix="drover-v$VERSION/" -o "artifacts/source/drover-v$VERSION.tar.gz" "$GITHUB_SHA"
          cd artifacts/source
          sha256sum "drover-v$VERSION.tar.gz" > "drover-v$VERSION.tar.gz.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/source/*.tar.gz
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: artifacts/source/*.tar.gz
          sbom-path: artifacts/sbom/drover-v${{ needs.metadata.outputs.version }}.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-source
          path: artifacts/
          if-no-files-found: error

  linux-build:
    name: Build unsigned Linux package
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write # obtain the identity token for manual package attestations
      attestations: write # write the manual package attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish native client
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          dotnet publish src/Drover.Native -f net11.0-desktop -c Release -warnaserror \
            -p:DroverNativeTargetFrameworks=net11.0-desktop -r linux-x64 --self-contained true \
            "-p:DroverReleaseVersion=$VERSION" "-p:DroverUpdatePublicKey=$UPDATE_PUBLIC_KEY" -o artifacts/publish
      - name: Build and inspect deb
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          scripts/package-desktop-linux.sh artifacts/publish artifacts/package "$VERSION"
          dpkg-deb --contents artifacts/package/*.deb | grep -F './opt/drover/Drover.Native'
          dpkg-deb --field artifacts/package/*.deb Package Version Architecture
          cd artifacts/package
          sha256sum ./*.deb > "$(basename ./*.deb).sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'workflow_dispatch'
        with:
          subject-path: artifacts/package/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-unsigned
          path: artifacts/package/*
          if-no-files-found: error

  windows-build:
    name: Build unsigned Windows package
    needs: metadata
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write # obtain the identity token for manual package attestations
      attestations: write # write the manual package attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish native client
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: >-
          dotnet publish src/Drover.Native -f net11.0-desktop -c Release -warnaserror
          -p:DroverNativeTargetFrameworks=net11.0-desktop -r win-x64 --self-contained true
          "-p:DroverReleaseVersion=$env:VERSION" "-p:DroverUpdatePublicKey=$env:UPDATE_PUBLIC_KEY"
          -o artifacts/publish
      - name: Build and inspect MSIX
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: pwsh
        run: |
          ./scripts/package-desktop-windows.ps1 artifacts/publish artifacts/package $env:VERSION
          $package = Get-ChildItem artifacts/package/*.msix
          $package.Name | Select-String -SimpleMatch "-unsigned.msix"
          $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content "$($package.FullName).sha256" -Encoding ascii
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'workflow_dispatch'
        with:
          subject-path: artifacts/package/*.msix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-unsigned
          path: artifacts/package/*
          if-no-files-found: error

  macos-build:
    name: Build unsigned macOS package
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write # obtain the identity token for manual package attestations
      attestations: write # write the manual package attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish native client
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          [[ "$(uname -m)" == arm64 ]] && rid=osx-arm64 || rid=osx-x64
          dotnet publish src/Drover.Native -f net11.0-desktop -c Release -warnaserror \
            -p:DroverNativeTargetFrameworks=net11.0-desktop -r "$rid" --self-contained true \
            "-p:DroverReleaseVersion=$VERSION" "-p:DroverUpdatePublicKey=$UPDATE_PUBLIC_KEY" -o artifacts/publish
      - name: Build and inspect DMG
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          scripts/package-desktop-macos.sh artifacts/publish artifacts/package "$VERSION"
          hdiutil verify artifacts/package/*.dmg
          cd artifacts/package
          shasum -a 256 ./*.dmg > "$(basename ./*.dmg).sha256"
      - name: Preserve publish output for tag signing
        run: tar -C artifacts/publish -czf artifacts/publish.tar.gz .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'workflow_dispatch'
        with:
          subject-path: artifacts/package/*.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-unsigned
          path: |
            artifacts/package/*
            artifacts/publish.tar.gz
          if-no-files-found: error

  linux-finalize:
    name: Sign or label Linux package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # obtain the identity token for final package attestations
      attestations: write # write the final package attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-linux-unsigned
          path: unsigned
      - name: Sign when the private key exists
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          mkdir release
          input=$(find unsigned -maxdepth 1 -name '*.deb' -print -quit)
          if [[ -z "$GPG_PRIVATE_KEY_BASE64" || -z "$GPG_PASSPHRASE" ]]; then
            cp "$input" release/
            echo "Linux signing secrets are absent. Publishing the unsigned package."
          else
            umask 077
            key="$RUNNER_TEMP/drover-signing.asc"
            printf '%s' "$GPG_PRIVATE_KEY_BASE64" | base64 --decode > "$key"
            gpg --batch --import "$key"
            output="release/$(basename "${input/-unsigned.deb/-signed.deb}")"
            cp "$input" "$output"
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$output"
            gpg --verify "$output.asc" "$output"
          fi
          cd release
          sha256sum ./*.deb > "$(basename ./*.deb).sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux
          path: release/*
          if-no-files-found: error

  windows-finalize:
    name: Sign or label Windows package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # obtain the identity token for final package attestations
      attestations: write # write the final package attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows-unsigned
          path: unsigned
      - name: Sign when the certificate exists
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item release -ItemType Directory | Out-Null
          $inputPackage = Get-ChildItem unsigned/*.msix
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
              Copy-Item $inputPackage.FullName release
              Write-Output "Windows signing secrets are absent. Publishing the unsigned package."
              exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "drover-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw "The Windows SDK signtool was not found." }
          $outputPackage = "release/$($inputPackage.Name.Replace('-unsigned.msix', '-signed.msix'))"
          Copy-Item $inputPackage.FullName $outputPackage
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:CERTIFICATE_PASSWORD $outputPackage
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE." }
          & $signtool.FullName verify /pa /all $outputPackage
          if ($LASTEXITCODE -ne 0) { throw "The signed MSIX did not verify." }
          Remove-Item $certificate -Force
      - name: Checksum
        shell: pwsh
        run: |
          $package = Get-ChildItem release/*.msix
          $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content "$($package.FullName).sha256" -Encoding ascii
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.msix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows
          path: release/*
          if-no-files-found: error

  macos-finalize:
    name: Sign, notarize or label macOS package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, macos-build]
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # obtain the identity token for final package attestations
      attestations: write # write the final package attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-macos-unsigned
          path: unsigned
      - name: Sign and notarize when every secret exists
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          mkdir publish release
          tar -xzf unsigned/publish.tar.gz -C publish
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$NOTARY_KEY_BASE64" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" ]]; then
            scripts/package-desktop-macos.sh publish release "$VERSION"
            echo "macOS signing secrets are incomplete. Publishing the unsigned package."
            exit 0
          fi
          umask 077
          keychain="$RUNNER_TEMP/drover-signing.keychain-db"
          certificate="$RUNNER_TEMP/drover-signing.p12"
          notary_key="$RUNNER_TEMP/AuthKey.p8"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$notary_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk 'NR == 1 { print $2 }')
          if [[ -z "$identity" ]]; then
            echo "::error::The macOS certificate has no code-signing identity."
            exit 1
          fi
          scripts/package-desktop-macos.sh publish release "$VERSION" signed-notarized "$identity"
          dmg=$(find release -name '*.dmg' -print -quit)
          xcrun notarytool submit "$dmg" --key "$notary_key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          security delete-keychain "$keychain"
      - name: Checksum
        run: |
          cd release
          shasum -a 256 ./*.dmg > "$(basename ./*.dmg).sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos
          path: release/*
          if-no-files-found: error

  update-feed:
    name: Sign desktop update feed
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, linux-finalize, windows-finalize, macos-finalize]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    outputs:
      available: ${{ steps.keys.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Check update signing keys
        id: keys
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          if [[ -n "$SPARKLE_PRIVATE_KEY" && -n "$SPARKLE_PUBLIC_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "The update signing key pair is absent. No automatic update feed will be published."
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.keys.outputs.available == 'true'
        with:
          name: desktop-linux
          path: packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.keys.outputs.available == 'true'
        with:
          name: desktop-windows
          path: packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.keys.outputs.available == 'true'
        with:
          name: desktop-macos
          path: packages
      - name: Build and verify signed appcast
        if: steps.keys.outputs.available == 'true'
        env:
          DOTNET_ROLL_FORWARD: Major
          SPARKLE_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
          VERSION: ${{ needs.metadata.outputs.version }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          dotnet tool restore
          mkdir update-feed
          [[ "$CHANNEL" == preview ]] && prefix=appcast-preview || prefix=appcast
          channel_args=()
          [[ "$CHANNEL" == preview ]] && channel_args=(--channel preview)
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
          linux=$(find packages -maxdepth 1 -name '*.deb' -print -quit)
          windows=$(find packages -maxdepth 1 -name '*.msix' -print -quit)
          macos=$(find packages -maxdepth 1 -name '*.dmg' -print -quit)
          dotnet tool run netsparkle-generate-appcast -- --single-file "$linux" --file-version "$VERSION" \
            --os linux --base-url "$base" --product-name Drover --appcast-output-directory update-feed \
            --output-file-name "$prefix-linux" "${channel_args[@]}"
          dotnet tool run netsparkle-generate-appcast -- --single-file "$windows" --file-version "$VERSION" \
            --os windows --base-url "$base" --product-name Drover --appcast-output-directory update-feed \
            --output-file-name "$prefix-windows" "${channel_args[@]}"
          dotnet tool run netsparkle-generate-appcast -- --single-file "$macos" --file-version "$VERSION" \
            --os macos --base-url "$base" --product-name Drover --appcast-output-directory update-feed \
            --output-file-name "$prefix-macos" "${channel_args[@]}"
          for feed in update-feed/*.xml; do
            dotnet tool run netsparkle-generate-appcast -- --verify "$feed" \
              --signature "$(cat "$feed.signature")"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.keys.outputs.available == 'true'
        with:
          name: desktop-update-feed
          path: update-feed/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, source, linux-finalize, windows-finalize, macos-finalize, update-feed]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release and upload its artifacts
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-source
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-linux
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-windows
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-macos
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.update-feed.outputs.available == 'true'
        with:
          name: desktop-update-feed
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          mapfile -d '' assets < <(find release -type f -print0)
          extra=()
          [[ "$CHANNEL" == preview ]] && extra+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --verify-tag "${extra[@]}"
