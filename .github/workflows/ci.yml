# Builds and tests pull request code. The repository is public, so every job here
# runs on GitHub-hosted runners. Never give this workflow a self-hosted runner.
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    name: Build, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Drover.slnx
      # Local builds run Debug, which adds hot reload outputs that a Release build never makes (#916).
      - name: Debug build of the Web SDK test projects
        run: |
          dotnet build tests/Drover.Server.Tests --no-restore -c Debug -warnaserror
          dotnet build tests/Drover.Native.UITests --no-restore -c Debug -warnaserror
      - name: Build, warnings are errors
        run: dotnet build Drover.slnx --no-restore -c Release -warnaserror
      - name: Format check
        run: dotnet format Drover.slnx --no-restore --verify-no-changes
      - name: Test
        run: dotnet test --solution Drover.slnx --no-build -c Release
      - name: Vulnerable packages
        run: dotnet list Drover.slnx package --vulnerable --include-transitive
      - name: License check
        run: |
          dotnet tool restore
          dotnet tool run nuget-license -- -i Drover.slnx -t -a licenses/allowed.json -mapping licenses/url-mappings.json -err
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

  dev-postgres:
    name: Development PostgreSQL helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: brew install postgresql@17
      - name: Check PostgreSQL binary discovery
        run: python3 scripts/check-dev-postgres.py
      - name: Start, test, and stop PostgreSQL
        shell: bash
        run: |
          export DROVER_PG_DIR="$RUNNER_TEMP/drover-dev-postgres"
          export DROVER_PG_PORT=54329
          cleanup() {
            scripts/dev-postgres.sh stop
            test ! -e "$DROVER_PG_DIR"
          }
          trap cleanup EXIT
          unset DROVER_TEST_POSTGRES
          postgres_environment=$(scripts/dev-postgres.sh start)
          eval "$postgres_environment"
          test -n "$DROVER_TEST_POSTGRES"
          dotnet test --project tests/Drover.Data.Tests -- --filter-class '*ThreadReadTests'

  compose:
    name: Compose builds and starts within budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate compose files
        env:
          DROVER_DOMAIN: drover.example.org
        run: |
          docker compose config --quiet
          docker compose --profile push config --quiet
          docker compose -f compose.yaml -f compose.proxy.yaml config --quiet
      - name: Build image under the memory budget a small VPS has
        # BuildKit ignores a memory flag on `docker build`, so the budget is set on the builder container
        # that runs every build step. If a step needs more than 2 GB, the builder is killed and this step fails.
        run: |
          docker buildx create --name budget --driver docker-container \
            --driver-opt memory=2g --driver-opt memory-swap=2g
          docker buildx inspect --bootstrap budget
          builder=buildx_buildkit_budget0
          pid=$(docker inspect --format '{{.State.Pid}}' "$builder")
          cgroup="/sys/fs/cgroup$(cut -d: -f3 "/proc/$pid/cgroup")"
          # Docker can put its init process in a child cgroup. Measure the whole builder at its container scope.
          cgroup="${cgroup%/init}"
          memory_max=$(cat "$cgroup/memory.max")
          swap_max=$(cat "$cgroup/memory.swap.max")
          printf 'BuildKit cgroup %s has memory.max=%s and memory.swap.max=%s\n' "$cgroup" "$memory_max" "$swap_max"
          test "$memory_max" = "2147483648"
          # A runner without any swap devices cannot swap regardless of the controller's setting.
          if [ "$swap_max" != "0" ]; then
            test "$(wc -l < /proc/swaps)" = "1"
          fi
          start=$(date +%s)
          docker buildx build --builder budget --load -t drover:local .
          build_seconds=$(( $(date +%s) - start ))
          image_bytes=$(docker image inspect drover:local --format '{{.Size}}')
          peak_bytes=$(cat "$cgroup/memory.peak")
          oom_kills=$(awk '$1 == "oom_kill" { print $2 }' "$cgroup/memory.events")
          test "$oom_kills" = "0"
          {
            echo "### Image build"
            echo "| Measure | Value |"
            echo "| --- | --- |"
            echo "| Build time | ${build_seconds} s |"
            echo "| Image size | ${image_bytes} bytes |"
            echo "| Peak memory of the 2 GB builder, page cache included | ${peak_bytes} bytes |"
            echo "| Out-of-memory kills | ${oom_kills} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the image default for uploaded files
        run: |
          docker run --rm --network none --entrypoint sh drover:local -ec '
            test "$(id -u)" != 0
            test "$Files__Path" = /var/lib/drover/files
            probe="$(mktemp "$Files__Path/.probe.XXXXXXXX")"
            rm "$probe"
          '
      - name: Scan the built Drover image with Grype
        env:
          GRYPE_VERSION: "0.121.3"
          GRYPE_SHA256: "e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85"
        run: |
          archive="$RUNNER_TEMP/grype.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "$GRYPE_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" grype
          "$RUNNER_TEMP/grype" docker:drover:local --only-fixed --fail-on high
      - name: Start and wait for health
        run: |
          docker compose up -d --wait --wait-timeout 180 --no-build
          curl --fail --silent --show-error http://localhost:8080/health/ready
          curl --fail --silent --show-error http://localhost:8080/ | grep --quiet '<title>Drover</title>'
      - name: Serve the browser client's entry point, deep link, and assets from the built image
        run: |
          curl --fail --silent --show-error http://localhost:8080/ --output "$RUNNER_TEMP/index.html"
          grep --quiet '<base href="/"' "$RUNNER_TEMP/index.html"
          curl --fail --silent --show-error http://localhost:8080/sign-in --output "$RUNNER_TEMP/sign-in.html"
          cmp "$RUNNER_TEMP/index.html" "$RUNNER_TEMP/sign-in.html"
          curl --fail --silent --show-error http://localhost:8080/manifest.webmanifest | grep --quiet '"scope": "/"'
          curl --fail --silent --show-error http://localhost:8080/service-worker.js | grep --quiet 'service-worker-assets.js'
          curl --fail --silent --show-error http://localhost:8080/service-worker-assets.js --output /dev/null
      - name: Send the address the client was served under to the root
        run: |
          location=$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' 'http://localhost:8080/native/sign-in?from=link')
          test "${location}" = "http://localhost:8080/sign-in?from=link"
          curl --fail --silent --show-error http://localhost:8080/native/service-worker.js | grep --quiet 'registration.unregister()'
      - name: The server runs as a non-root user
        run: |
          uid=$(docker compose exec -T drover id -u)
          echo "uid=${uid}"
          test "${uid}" != "0"
      - name: The server cannot write to its root filesystem
        run: |
          if docker compose exec -T drover sh -c 'touch /app/probe' 2>/dev/null; then
            echo "the root filesystem of drover is writable"
            exit 1
          fi
          docker compose exec -T drover sh -c 'touch /tmp/probe && rm /tmp/probe'
      - name: The server can read only its application secret
        run: |
          docker compose exec -T drover sh -c 'test -r /run/secrets/app_password && test ! -e /run/secrets/postgres_password && test ! -e /run/secrets/owner_password'
      - name: Secrets and native sign-in survive container replacement
        run: |
          read_hashes() { docker compose run --rm --no-deps --entrypoint sha256sum database-init /run/secrets/postgres_password /run/secrets/owner_password /run/secrets/app_password; }
          before=$(read_hashes)
          python3 scripts/check-native-session-redeploy.py
          after=$(read_hashes)
          test "${before}" = "${after}"
          curl --fail --silent --show-error http://localhost:8080/health/ready
      - name: Ready turns unhealthy when the database stops
        run: |
          docker compose stop db
          for _ in $(seq 1 20); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/health/ready || true)
            if [ "${code}" = "503" ]; then
              echo "ready reported 503 with the database stopped"
              exit 0
            fi
            sleep 3
          done
          echo "ready stayed at ${code} with the database stopped"
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
