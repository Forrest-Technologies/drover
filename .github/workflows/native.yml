name: Native clients

on:
  pull_request:
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Android dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.NUGET_PACKAGES }}
            ~/.m2/repository
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/dotnet-android/MavenCacheDirectory
            ~/.local/share/Xamarin/zips
          key: android-downloads-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', '**/NuGet.Config', '**/nuget.config', '**/packages.lock.json', '**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/libs.versions.toml', '**/gradle.lockfile', '**/pom.xml') }}
          restore-keys: |
            android-downloads-${{ runner.os }}-${{ runner.arch }}-v1-
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 platforms;android-37.2 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install Android workload
        run: dotnet workload install android --version 11.0.100
      - name: Build Android, warnings are errors
        run: |
          dotnet build src/Drover.Native -f net11.0-android -p:DroverNativeTargetFrameworks=net11.0-android -c Release -warnaserror
          dll=src/Drover.Native/bin/Release/net11.0-android/Drover.Native.dll
          test -f "$dll"
          if grep -a -q -E 'ScreenChecks|CheckSettings|TryGetIsolatedText|TimelineFocusCheck|MultilineInputFocusCheck|LongConversationCheck|DROVER_MULTILINE_FOCUS_CHECK|UnreachableOpenCheck|drover\.field_input|DROVER_FIELD_INPUT_CHECK|FieldInputCheck|NativeStop' "$dll"; then
            echo "Screen-check, focus check, unreachable-open check and field check hooks must not be compiled into the shipping Android binary"
            exit 1
          fi
      - name: Build the screen checks and an Android build made for them
        run: |
          dotnet build tests/Drover.Native.UITests -c Release -warnaserror
          dotnet build src/Drover.Native -f net11.0-android -p:DroverNativeTargetFrameworks=net11.0-android -c Release \
            -p:DroverUiChecks=true -p:ApplicationDisplayVersion=checks -warnaserror -o "$RUNNER_TEMP/ui-checks-android"
      - name: Build the Android unreachable-open check
        run: |
          dotnet build src/Drover.Native -f net11.0-android -p:DroverNativeTargetFrameworks=net11.0-android -c Release \
            -p:DroverUnreachableCheck=true -warnaserror -o "$RUNNER_TEMP/unreachable-android"
      - name: Build Android field check
        run: >
          dotnet build src/Drover.Native -f net11.0-android -p:DroverNativeTargetFrameworks=net11.0-android
          -p:DroverFieldCheck=true -c Release -warnaserror -o "$RUNNER_TEMP/field-check-android"

      # No emulator is needed: prove a failing display reset is raised only when no check already failed.
      - name: Check the Android cleanup error handling
        run: python3 scripts/check-native-android-text-editing.py --self-test-cleanup
      # No emulator is needed: prove the safe-area check measures only a settled frame.
      - name: Check settled safe-area capture
        run: python3 scripts/test-check-native-android-text-editing.py
      - name: Check Android address editing, safe-area layout, and the shared screen checks
        timeout-minutes: 20
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-35;default;x86_64'
          printf 'no\n' | avdmanager create avd -n drover-editing -k 'system-images;android-35;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd drover-editing -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/drover-emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          if ! timeout 180 adb wait-for-device; then
            cat "$RUNNER_TEMP/drover-emulator.log"
            exit 1
          fi
          for _ in {1..60}; do
            if [[ $(adb shell getprop sys.boot_completed) == 1 ]]; then break; fi
            sleep 2
          done
          if [[ $(adb shell getprop sys.boot_completed) != 1 ]]; then
            cat "$RUNNER_TEMP/drover-emulator.log"
            exit 1
          fi
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb install src/Drover.Native/bin/Release/net11.0-android/*-Signed.apk
          bash scripts/check-native-android-text-editing.sh --editing
          python3 scripts/check-native-android-back.py
          # The checks package is a different id. Name the emulator so install and run target the same device and the
          # harness will not clear any other device.
          serial="$(adb devices | awk '/^emulator-/{ print $1; exit }')"
          if [[ -z "${serial}" ]]; then
            echo "The screen checks need the emulator this job started."
            exit 1
          fi
          adb -s "${serial}" install -r "$RUNNER_TEMP"/ui-checks-android/*-Signed.apk
          DROVER_ANDROID_SERIAL="${serial}" dotnet run --project tests/Drover.Native.UITests -c Release --no-build -- android
          adb install -r "$RUNNER_TEMP"/unreachable-android/*-Signed.apk
          DROVER_UNREACHABLE_OPEN_ONLY=1 python3 scripts/check-native-android-text-editing.py
          adb install -r "$RUNNER_TEMP"/field-check-android/*-Signed.apk
          python3 scripts/check-native-android-text-editing.py --field-input

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: android-layout
        if: always()
        with:
          name: native-android-layout
          path: artifacts/android-layout/

      - name: Link Android screenshots
        if: always() && steps.android-layout.outputs.artifact-url != ''
        env:
          SCREENSHOTS_URL: ${{ steps.android-layout.outputs.artifact-url }}
        run: printf '### Screenshots\n\n- [Android layout and diagnostics](%s)\n' "$SCREENSHOTS_URL" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-android-development
          path: src/Drover.Native/bin/Release/net11.0-android/*-Signed.apk
          if-no-files-found: error

  ios:
    name: iOS
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Require Xcode 27.2
        run: xcodebuild -version | grep -F 'Xcode 27.2'
      - name: Install the iOS workload
        run: dotnet workload install ios --version 11.0.100
      - name: Build iOS, warnings are errors
        run: |
          dotnet build src/Drover.Native -f net11.0-ios \
            -p:DroverNativeTargetFrameworks=net11.0-ios \
            -p:DroverEnableApple=true \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:CodesignKey=- \
            -c Release \
            -warnaserror
          dll="$(find src/Drover.Native/bin/Release/net11.0-ios -type f -name 'Drover.Native.dll' -print -quit)"
          test -n "$dll"
          if grep -a -q -E 'ScreenChecks|CheckSettings|TryGetIsolatedText|MultilineInputFocusCheck|LongConversationCheck|DROVER_MULTILINE_FOCUS_CHECK' "$dll"; then
            echo "Screen-check hooks must not be compiled into the shipping iOS binary"
            exit 1
          fi
      - name: Build the screen checks and an iOS build made for them
        run: |
          dotnet build tests/Drover.Native.UITests -c Release -warnaserror
          dotnet build src/Drover.Native -f net11.0-ios \
            -p:DroverNativeTargetFrameworks=net11.0-ios \
            -p:DroverEnableApple=true \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:CodesignKey=- \
            -p:DroverUiChecks=true \
            -c Release \
            -warnaserror \
            -o "$RUNNER_TEMP/ui-checks-ios"
      - name: Start PostgreSQL for the screen checks
        env:
          LC_ALL: en_US.UTF-8
        run: |
          brew install postgresql@17
          bin="$(brew --prefix postgresql@17)/bin"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          umask 077
          printf '%s' "$password" > "$RUNNER_TEMP/postgres-password"
          "$bin/initdb" -D "$RUNNER_TEMP/postgres" \
            --auth-host=scram-sha-256 \
            --auth-local=trust \
            --username=postgres \
            --pwfile="$RUNNER_TEMP/postgres-password" > /dev/null
          rm "$RUNNER_TEMP/postgres-password"
          "$bin/pg_ctl" -D "$RUNNER_TEMP/postgres" \
            -o "-p 5432 -c listen_addresses=127.0.0.1" \
            -l "$RUNNER_TEMP/postgres.log" \
            -w start
          echo "DROVER_TEST_POSTGRES=Host=127.0.0.1;Port=5432;Username=postgres;Password=$password" >> "$GITHUB_ENV"
      - name: Open the app and pass the shared screen checks after a restart
        run: |
          device="$(xcrun simctl list devices available --json \
            | jq -r '[.devices["com.apple.CoreSimulator.SimRuntime.iOS-27-2"][]?
              | select(.name | startswith("iPhone"))][0].udid // empty')"
          test -n "$device"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          trap 'xcrun simctl shutdown "$device" || true' EXIT
          app="$(find "$RUNNER_TEMP/ui-checks-ios" -type d -name 'Drover.Native.app' -print -quit)"
          test -n "$app"
          # The harness connects here, after the simulator boot. Check the server at that moment, not in the step
          # that started it. A ready server answers the first probe, so a healthy run pays one quick check.
          bin="$(brew --prefix postgresql@17)/bin"
          for ((attempt = 1; attempt <= 30; attempt++)); do
            if "$bin/pg_isready" -h 127.0.0.1 -p 5432 -t 1 -q; then
              break
            fi
            if ((attempt == 30)); then
              echo "PostgreSQL did not accept connections after 30 probes"
              tail -n 50 "$RUNNER_TEMP/postgres.log"
              exit 1
            fi
            sleep 1
          done
          dotnet run --project tests/Drover.Native.UITests -c Release --no-build -- ios "$app" "$device"

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build desktop, warnings are errors
        shell: bash
        run: |
          dotnet build src/Drover.Native -f net11.0-desktop -p:DroverNativeTargetFrameworks=net11.0-desktop -c Release -warnaserror
          dll=src/Drover.Native/bin/Release/net11.0-desktop/Drover.Native.dll
          test -f "$dll"
          if grep -a -q -E 'ScreenChecks|CheckSettings|TryGetIsolatedText|TimelineFocusCheck|MultilineInputFocusCheck|LongConversationCheck|DROVER_MULTILINE_FOCUS_CHECK|UnreachableOpenCheck|drover\.field_input|DROVER_FIELD_INPUT_CHECK|FieldInputCheck|NativeStop' "$dll"; then
            echo "Screen-check, focus check, unreachable-open check and field check hooks must not be compiled into the shipping desktop binary"
            exit 1
          fi
      - name: Build the Linux unreachable-open check
        if: runner.os == 'Linux'
        run: |
          dotnet build src/Drover.Native -f net11.0-desktop -p:DroverNativeTargetFrameworks=net11.0-desktop -c Release \
            -p:DroverUnreachableCheck=true -warnaserror -o "$RUNNER_TEMP/unreachable-desktop"
      - name: Install the Linux display test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils imagemagick libgl1-mesa-dri dbus gnome-keyring libsecret-1-0
      - name: Open the Linux app, verify its first frame, and keep a sign-in across a restart
        if: runner.os == 'Linux'
        run: |
          dotnet build src/Drover.Native -f net11.0-desktop -p:DroverNativeTargetFrameworks=net11.0-desktop -p:DroverFieldCheck=true -c Release -warnaserror -o "$RUNNER_TEMP/field-check-desktop"
          xvfb-run -a bash scripts/check-native-desktop.sh "$RUNNER_TEMP/unreachable-desktop/Drover.Native.dll" "$RUNNER_TEMP/field-check-desktop/Drover.Native.dll"
      - name: Keep a sign-in in the system credential store across a restart
        if: runner.os != 'Linux'
        run: dotnet test --project tests/Drover.Native.Desktop.Tests -c Release
      - name: A focused activity row keeps focus when a new event arrives
        shell: bash
        run: |
          dotnet build src/Drover.Native -f net11.0-desktop -p:DroverNativeTargetFrameworks=net11.0-desktop -p:DroverTimelineFocusCheck=true -c Release -warnaserror -o "$RUNNER_TEMP/timeline-focus-desktop"
          export DROVER_TIMELINE_FOCUS_CHECK=1
          app="$RUNNER_TEMP/timeline-focus-desktop/Drover.Native.dll"
          if [[ "$RUNNER_OS" == Linux ]]; then
            set +e
            xvfb-run -a dotnet "$app" >"$RUNNER_TEMP/focus.log" 2>&1
            code=$?
            set -e
            cat "$RUNNER_TEMP/focus.log"
            # The check can pass and the process can still die while the virtual display tears the window down.
            if grep -F 'Activity focus check passed.' "$RUNNER_TEMP/focus.log"; then
              exit 0
            fi
            exit "$code"
          else
            dotnet "$app"
          fi
      - name: Every multiline and single-line text input takes focus and accepts text after a tap
        shell: bash
        run: |
          dotnet build src/Drover.Native -f net11.0-desktop -p:DroverNativeTargetFrameworks=net11.0-desktop -p:DroverMultilineFocusCheck=true -c Release -warnaserror -o "$RUNNER_TEMP/multiline-focus-desktop"
          export DROVER_MULTILINE_FOCUS_CHECK=1
          app="$RUNNER_TEMP/multiline-focus-desktop/Drover.Native.dll"
          if [[ "$RUNNER_OS" == Linux ]]; then
            set +e
            xvfb-run -a dotnet "$app" >"$RUNNER_TEMP/multiline-focus.log" 2>&1
            code=$?
            set -e
            cat "$RUNNER_TEMP/multiline-focus.log"
            # The check can pass and the process can still die while the virtual display tears the window down.
            if grep -F 'Multiline input focus check passed.' "$RUNNER_TEMP/multiline-focus.log"; then
              exit 0
            fi
            exit "$code"
          else
            dotnet "$app"
          fi
      - name: A long conversation costs what its page holds and stays in reach
        # The list is the same code on every desktop, so one of them runs it.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet build src/Drover.Native -f net11.0-desktop -p:DroverNativeTargetFrameworks=net11.0-desktop -p:DroverLongConversationCheck=true -c Release -warnaserror -o "$RUNNER_TEMP/long-conversation-desktop"
          export DROVER_LONG_CONVERSATION_CHECK=1
          set +e
          xvfb-run -a dotnet "$RUNNER_TEMP/long-conversation-desktop/Drover.Native.dll" >"$RUNNER_TEMP/long-conversation.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/long-conversation.log"
          # The check can pass and the process can still die while the virtual display tears the window down.
          if grep -F 'Long conversation check passed.' "$RUNNER_TEMP/long-conversation.log"; then
            exit 0
          fi
          if [[ "$code" == 0 ]]; then
            echo "The long conversation check ended without saying it passed."
            exit 1
          fi
          exit "$code"
      - name: Check desktop dependency licenses
        env:
          DroverNativeTargetFrameworks: net11.0-desktop
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool restore
          dotnet tool run nuget-license -- -i Drover.Native.slnx -t -a licenses/allowed.json -mapping licenses/url-mappings.json -override licenses/allowed-exceptions.json -err
      - name: Build the screen checks and a desktop build made for them
        shell: bash
        run: |
          dotnet build tests/Drover.Native.UITests -c Release -warnaserror
          dotnet build src/Drover.Native -f net11.0-desktop -p:DroverNativeTargetFrameworks=net11.0-desktop -c Release \
            -p:DroverUiChecks=true -warnaserror -o "$RUNNER_TEMP/ui-checks-desktop"
      # Linux runs PostgreSQL in a container. Windows has it installed but stopped; macOS installs it.
      - name: Start PostgreSQL for the screen checks on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The image installs the service disabled.
          Get-Service -Name 'postgresql*' | Set-Service -StartupType Manual -PassThru | Start-Service
          "DROVER_TEST_POSTGRES=Host=127.0.0.1;Port=5432;Username=postgres;Password=$env:PGPASSWORD" >> $env:GITHUB_ENV
      - name: Start PostgreSQL for the screen checks on macOS
        if: runner.os == 'macOS'
        env:
          LC_ALL: en_US.UTF-8
        run: |
          brew install postgresql@17
          bin="$(brew --prefix postgresql@17)/bin"
          "$bin/initdb" -D "$RUNNER_TEMP/postgres" -A trust -U postgres > /dev/null
          "$bin/pg_ctl" -D "$RUNNER_TEMP/postgres" -o "-p 5432 -c listen_addresses=127.0.0.1" -l "$RUNNER_TEMP/postgres.log" -w start
          echo "DROVER_TEST_POSTGRES=Host=127.0.0.1;Port=5432;Username=postgres" >> "$GITHUB_ENV"
      - name: Open the app and pass the shared screen checks
        shell: bash
        run: |
          checks=(dotnet run --project tests/Drover.Native.UITests -c Release --no-build -- desktop "$RUNNER_TEMP/ui-checks-desktop/Drover.Native.dll")
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a "${checks[@]}"
          else
            "${checks[@]}"
          fi

  browser:
    env:
      DroverNativeTargetFrameworks: net11.0-browserwasm
    name: Publish browser client
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install browser workload
        run: dotnet workload install wasm-tools
      - name: Check formatting of the native client and its shared sources
        # The analyzers run in the builds above; this checks the layout of the files only, without a restore.
        run: dotnet format whitespace --folder --verify-no-changes --include src/Drover.Native src/Shared tests/Drover.Native.UITests/App
      - name: Check browser text selection routing
        run: node --test scripts/check-native-text-selection.mjs
      - name: Publish browser, warnings are errors
        run: dotnet publish src/Drover.Native -f net11.0-browserwasm -p:DroverNativeTargetFrameworks=net11.0-browserwasm -c Release -warnaserror -o artifacts/native
      - name: Check native dependency licenses
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool restore
          dotnet tool run nuget-license -- -i Drover.Native.slnx -t -a licenses/allowed.json -mapping licenses/url-mappings.json -override licenses/allowed-exceptions.json -err
      - name: Prepare the browser-test runtime
        run: |
          dotnet build tests/Drover.Presentation.Tests -c Release -warnaserror
          pwsh tests/Drover.Presentation.Tests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium
      - name: Exercise the trimmed publish under the server CSP
        run: node scripts/check-native-browser.mjs artifacts/native/wwwroot
      - name: Record a message, read a reply aloud and hold a scripted call with Chromium's fake microphone
        run: node scripts/check-native-voice.mjs artifacts/native/wwwroot artifacts/native-voice
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: browser-screens
        if: always()
        with:
          name: browser-screens
          path: artifacts/native-smoke
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: browser-voice-screens
        if: always()
        with:
          name: browser-voice-screens
          path: artifacts/native-voice
          if-no-files-found: warn

      - name: Link browser screenshots
        if: always() && (steps.browser-screens.outputs.artifact-url != '' || steps.browser-voice-screens.outputs.artifact-url != '')
        env:
          BROWSER_URL: ${{ steps.browser-screens.outputs.artifact-url }}
          VOICE_URL: ${{ steps.browser-voice-screens.outputs.artifact-url }}
        run: |
          {
            printf '### Screenshots\n\n'
            if [[ -n "$BROWSER_URL" ]]; then
              printf -- '- [Browser screen checks](%s)\n' "$BROWSER_URL"
            fi
            if [[ -n "$VOICE_URL" ]]; then
              printf -- '- [Browser voice and call checks](%s)\n' "$VOICE_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-browser
          path: artifacts/native/wwwroot
          if-no-files-found: error
