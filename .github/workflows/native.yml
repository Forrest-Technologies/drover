name: Native clients

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 platforms;android-37.2 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install Android workload
        run: dotnet workload install android --version 11.0.100
      - name: Build Android, warnings are errors
        run: |
          dotnet build src/Drover.Native -f net11.0-android -p:DroverNativeTargetFrameworks=net11.0-android -c Release -warnaserror
          dll=src/Drover.Native/bin/Release/net11.0-android/Drover.Native.dll
          test -f "$dll"
          if grep -a -q -E 'ScreenChecks|CheckSettings|TryGetIsolatedText' "$dll"; then
            echo "Screen-check hooks must not be compiled into the shipping Android binary"
            exit 1
          fi
      - name: Build the screen checks and an Android build made for them
        run: |
          dotnet build tests/Drover.Native.UITests -c Release -warnaserror
          dotnet build src/Drover.Native -f net11.0-android -p:DroverNativeTargetFrameworks=net11.0-android -c Release \
            -p:DroverUiChecks=true -p:ApplicationDisplayVersion=checks -warnaserror -o "$RUNNER_TEMP/ui-checks-android"

      - name: Check Android address editing, safe-area layout, and the shared screen checks
        timeout-minutes: 20
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-35;default;x86_64'
          printf 'no\n' | avdmanager create avd -n drover-editing -k 'system-images;android-35;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd drover-editing -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/drover-emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          if ! timeout 180 adb wait-for-device; then
            cat "$RUNNER_TEMP/drover-emulator.log"
            exit 1
          fi
          for _ in {1..60}; do
            if [[ $(adb shell getprop sys.boot_completed) == 1 ]]; then break; fi
            sleep 2
          done
          if [[ $(adb shell getprop sys.boot_completed) != 1 ]]; then
            cat "$RUNNER_TEMP/drover-emulator.log"
            exit 1
          fi
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb install src/Drover.Native/bin/Release/net11.0-android/*-Signed.apk
          bash scripts/check-native-android-text-editing.sh
          python3 scripts/check-native-android-back.py
          # The checks package is a different id. Name the emulator so install and run target the same device and the
          # harness will not clear any other device.
          serial="$(adb devices | awk '/^emulator-/{ print $1; exit }')"
          if [[ -z "${serial}" ]]; then
            echo "The screen checks need the emulator this job started."
            exit 1
          fi
          adb -s "${serial}" install -r "$RUNNER_TEMP"/ui-checks-android/*-Signed.apk
          DROVER_ANDROID_SERIAL="${serial}" dotnet run --project tests/Drover.Native.UITests -c Release --no-build -- android

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-android-layout
          path: artifacts/android-layout/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-android-development
          path: src/Drover.Native/bin/Release/net11.0-android/*-Signed.apk
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build desktop, warnings are errors
        shell: bash
        run: |
          dotnet build src/Drover.Native -f net11.0-desktop -p:DroverNativeTargetFrameworks=net11.0-desktop -c Release -warnaserror
          dll=src/Drover.Native/bin/Release/net11.0-desktop/Drover.Native.dll
          test -f "$dll"
          if grep -a -q -E 'ScreenChecks|CheckSettings|TryGetIsolatedText' "$dll"; then
            echo "Screen-check hooks must not be compiled into the shipping desktop binary"
            exit 1
          fi
      - name: Install the Linux display test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils imagemagick libgl1-mesa-dri dbus gnome-keyring libsecret-1-0
      - name: Open the Linux app, verify its first frame, and keep a sign-in across a restart
        if: runner.os == 'Linux'
        run: xvfb-run -a bash scripts/check-native-desktop.sh
      - name: Keep a sign-in in the system credential store across a restart
        if: runner.os != 'Linux'
        run: dotnet test --project tests/Drover.Native.Desktop.Tests -c Release
      - name: A focused activity row keeps focus when a new event arrives
        shell: bash
        run: |
          export DROVER_TIMELINE_FOCUS_CHECK=1
          app="src/Drover.Native/bin/Release/net11.0-desktop/Drover.Native.dll"
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a dotnet "$app"
          else
            dotnet "$app"
          fi
      - name: Check desktop dependency licenses
        env:
          DroverNativeTargetFrameworks: net11.0-desktop
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool restore
          dotnet tool run nuget-license -- -i Drover.Native.slnx -t -a licenses/allowed.json -mapping licenses/url-mappings.json -override licenses/allowed-exceptions.json -err
      - name: Build the screen checks and a desktop build made for them
        shell: bash
        run: |
          dotnet build tests/Drover.Native.UITests -c Release -warnaserror
          dotnet build src/Drover.Native -f net11.0-desktop -p:DroverNativeTargetFrameworks=net11.0-desktop -c Release \
            -p:DroverUiChecks=true -warnaserror -o "$RUNNER_TEMP/ui-checks-desktop"
      # Linux runs PostgreSQL in a container. Windows has it installed but stopped; macOS installs it.
      - name: Start PostgreSQL for the screen checks on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The image installs the service disabled.
          Get-Service -Name 'postgresql*' | Set-Service -StartupType Manual -PassThru | Start-Service
          "DROVER_TEST_POSTGRES=Host=127.0.0.1;Port=5432;Username=postgres;Password=$env:PGPASSWORD" >> $env:GITHUB_ENV
      - name: Start PostgreSQL for the screen checks on macOS
        if: runner.os == 'macOS'
        env:
          LC_ALL: en_US.UTF-8
        run: |
          brew install postgresql@17
          bin="$(brew --prefix postgresql@17)/bin"
          "$bin/initdb" -D "$RUNNER_TEMP/postgres" -A trust -U postgres > /dev/null
          "$bin/pg_ctl" -D "$RUNNER_TEMP/postgres" -o "-p 5432 -c listen_addresses=127.0.0.1" -l "$RUNNER_TEMP/postgres.log" -w start
          echo "DROVER_TEST_POSTGRES=Host=127.0.0.1;Port=5432;Username=postgres" >> "$GITHUB_ENV"
      - name: Open the app and pass the shared screen checks
        shell: bash
        run: |
          checks=(dotnet run --project tests/Drover.Native.UITests -c Release --no-build -- desktop "$RUNNER_TEMP/ui-checks-desktop/Drover.Native.dll")
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a "${checks[@]}"
          else
            "${checks[@]}"
          fi

  browser:
    env:
      DroverNativeTargetFrameworks: net11.0-browserwasm
    name: Publish browser client
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install browser workload
        run: dotnet workload install wasm-tools
      - name: Check formatting of the native client and its shared sources
        # The analyzers run in the builds above; this checks the layout of the files only, without a restore.
        run: dotnet format whitespace --folder --verify-no-changes --include src/Drover.Native src/Shared tests/Drover.Native.UITests/App
      - name: Publish browser, warnings are errors
        run: dotnet publish src/Drover.Native -f net11.0-browserwasm -p:DroverNativeTargetFrameworks=net11.0-browserwasm -c Release -warnaserror -o artifacts/native
      - name: Check native dependency licenses
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool restore
          dotnet tool run nuget-license -- -i Drover.Native.slnx -t -a licenses/allowed.json -mapping licenses/url-mappings.json -override licenses/allowed-exceptions.json -err
      - name: Prepare the existing browser-test runtime
        run: |
          dotnet build tests/Drover.Ui.Tests -c Release -warnaserror
          pwsh tests/Drover.Ui.Tests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium
      - name: Exercise the trimmed publish under the server CSP
        run: node scripts/check-native-browser.mjs artifacts/native/wwwroot
      - name: Exercise the same screens in the Blazor client
        env:
          DROVER_REFERENCE_ROOT: artifacts/reference/wwwroot
        run: |
          dotnet publish src/Drover.Web -c Release -warnaserror -o artifacts/reference
          node scripts/check-native-browser.mjs artifacts/native/wwwroot artifacts/reference-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screen-comparison
          path: |
            artifacts/native-smoke
            artifacts/reference-smoke
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-browser
          path: artifacts/native/wwwroot
          if-no-files-found: error
