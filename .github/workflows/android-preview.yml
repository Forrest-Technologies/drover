name: Android preview

on:
  pull_request:
    paths:
      - '.github/workflows/android-preview.yml'
      - 'src/Drover.Native/**'
      - 'src/Drover.Presentation/**'
      - 'src/Shared/**'
      - 'src/Drover.Client/**'
      - 'src/Drover.Contracts/**'
      - 'Drover.Native.slnx'
      - 'Directory.*.props'
      - 'global.json'
  push:
    tags:
      - 'v*-android-preview.*'

permissions: {}

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Keep the key and paths exactly as in native.yml so both Android builds share one cache. The dependency
      # declaration is in src/Drover.Native/Drover.Native.csproj, matched by **/*.csproj in the key below.
      # This workflow publishes on tags, so the cache is only for pull request checks, never for a release build.
      - name: Cache Android dependency downloads # zizmor: ignore[cache-poisoning] caches are ref-scoped and release jobs never restore this one
        if: github.ref_type != 'tag'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.NUGET_PACKAGES }}
            ~/.m2/repository
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/dotnet-android/MavenCacheDirectory
            ~/.local/share/Xamarin/zips
          key: android-downloads-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', '**/NuGet.Config', '**/nuget.config', '**/packages.lock.json', '**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/libs.versions.toml', '**/gradle.lockfile', '**/pom.xml') }}
          restore-keys: |
            android-downloads-${{ runner.os }}-${{ runner.arch }}-v1-
      - name: Check preview tag and version
        id: version
        shell: bash
        run: |
          version=0.1.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-android-preview\.[1-9][0-9]*$ ]]; then
              echo "::error::Use a tag like v0.1.0-android-preview.1"
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
          fi
          echo "display=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 platforms;android-37.2 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install .NET for Android
        run: dotnet workload install android --version 11.0.100
      - name: Build release APK
        env:
          DISPLAY_VERSION: ${{ steps.version.outputs.display }}
        run: |
          dotnet publish src/Drover.Native -f net11.0-android -c Release -warnaserror \
            -p:DroverNativeTargetFrameworks=net11.0-android -p:AndroidPackageFormats=apk \
            "-p:ApplicationDisplayVersion=$DISPLAY_VERSION" "-p:ApplicationVersion=$GITHUB_RUN_NUMBER" \
            -o artifacts/android
      - name: Check the packaged Android app
        env:
          DISPLAY_VERSION: ${{ steps.version.outputs.display }}
        run: |
          apk=artifacts/android/com.forresttechnologies.drover.client.apk
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          badging=$("$aapt" dump badging "$apk")
          grep -Fq "package: name='com.forresttechnologies.drover.client' versionCode='$GITHUB_RUN_NUMBER' versionName='$DISPLAY_VERSION'" <<< "$badging"
          grep -q '^launchable-activity:' <<< "$badging"
          manifest=$("$aapt" dump xmltree "$apk" AndroidManifest.xml)
          grep -q 'A: android:icon(' <<< "$manifest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-android-apk
          path: artifacts/android/com.forresttechnologies.drover.client.apk
          if-no-files-found: error
          retention-days: 1
      - name: Check formatting and dependency licenses
        run: |
          dotnet format whitespace --folder --verify-no-changes --include src/Drover.Native src/Shared
          dotnet tool restore
          dotnet tool run nuget-license -- -i Drover.Native.slnx -t -a licenses/allowed.json -mapping licenses/url-mappings.json -override licenses/allowed-exceptions.json -err

  sign:
    name: Sign and verify APK
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-preview
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-android-apk
          path: unsigned
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Sign, verify and checksum
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_SIGNING_KEY_ALIAS }}
          CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          umask 077
          temp=$(mktemp -d "$RUNNER_TEMP/drover-signing.XXXXXX")
          trap 'rm -r "$temp"' EXIT
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::The Android signing environment is incomplete."
            exit 1
          fi
          expected=$(tr -d '\r\n' <<< "$CERT_SHA256")
          if [[ ! "$expected" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Set the Android certificate SHA-256 in the signing environment."
            exit 1
          fi

          key="$temp/preview.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          input=unsigned/com.forresttechnologies.drover.client.apk
          "$tools/zipalign" -P 16 -f 4 "$input" "$temp/aligned.apk"
          echo "Aligned the unsigned APK."

          mkdir release
          apk="drover-$GITHUB_REF_NAME.apk"
          java -jar "$tools/lib/apksigner.jar" sign \
            --ks "$key" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --v4-signing-enabled false --out "release/$apk" "$temp/aligned.apk"
          echo "Signed the APK."

          if ! "$tools/zipalign" -c -P 16 -v 4 "release/$apk" > "$temp/alignment.log"; then
            tail -n 20 "$temp/alignment.log"
            echo "::error::The signed APK did not pass the alignment check."
            exit 1
          fi
          echo "Verified APK alignment."
          verified=$(java -jar "$tools/lib/apksigner.jar" verify --print-certs "release/$apk")
          # Some signing schemes name the signer by version instead of number.
          actual=$(tr -d '\r' <<< "$verified" |
            awk '/Signer.*certificate SHA-256 digest:/ { print tolower($NF) }' | sort -u)
          if [[ "${actual,,}" != "${expected,,}" ]]; then
            echo "::error::The APK signer does not match the configured Android certificate."
            exit 1
          fi
          echo "Verified the APK signature and certificate."

          cd release
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-android-apk
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    if: github.ref_type == 'tag'
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub prerelease and attach the signed assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-android-apk
          path: release
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="drover-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Drover Uno Android $GITHUB_REF_NAME" --prerelease --latest=false \
            --notes 'Install the Uno APK and sign in with the HTTPS address of your Drover server. It installs alongside the earlier MAUI preview. See the [Android preview guide](https://github.com/Forrest-Technologies/drover/blob/main/docs/android-preview.md) for server requirements and notification setup.' \
            "release/$apk" "release/$apk.sha256"
