name: Android preview

on:
  pull_request:
    paths:
      - '.github/workflows/android-preview.yml'
      - 'src/Drover.App/**'
      - 'src/Drover.Ui/**'
      - 'src/Drover.Client/**'
      - 'src/Drover.Contracts/**'
      - 'Drover.Apps.slnx'
      - 'Directory.*.props'
      - 'global.json'
  push:
    tags:
      - 'v*-android-preview.*'

permissions: {}

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check preview tag and version
        id: version
        shell: bash
        run: |
          version=0.1.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-android-preview\.[1-9][0-9]*$ ]]; then
              echo "::error::Use a tag like v0.1.0-android-preview.1"
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
          fi
          echo "display=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 platforms;android-37.2 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install .NET MAUI for Android
        run: dotnet workload install maui-android --version 11.0.100
      - name: Build release APK
        env:
          DISPLAY_VERSION: ${{ steps.version.outputs.display }}
        run: |
          dotnet publish src/Drover.App/Drover.App.csproj -c Release -warnaserror \
            "-p:ApplicationDisplayVersion=$DISPLAY_VERSION" "-p:ApplicationVersion=$GITHUB_RUN_NUMBER"
          dotnet format Drover.Apps.slnx --no-restore --verify-no-changes
          dotnet tool restore
          dotnet tool run nuget-license -- -i Drover.Apps.slnx -t -a licenses/allowed.json -mapping licenses/url-mappings.json -err
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-android-apk
          path: src/Drover.App/bin/Release/net11.0-android/publish/com.forresttechnologies.drover.preview.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and verify APK
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-preview
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-android-apk
          path: unsigned
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Sign, verify and checksum
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_SIGNING_KEY_ALIAS }}
          CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          umask 077
          key=$(mktemp "$RUNNER_TEMP/drover-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/zipalign" -P 16 -f 4 unsigned/com.forresttechnologies.drover.preview.apk "$RUNNER_TEMP/aligned.apk"
          mkdir release
          apk="drover-$GITHUB_REF_NAME.apk"
          "$tools/apksigner" sign --ks "$key" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "release/$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/zipalign" -c -P 16 4 "release/$apk"
          actual=$("$tools/apksigner" verify --print-certs "release/$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ -n "$CERT_SHA256" && "$actual" == "$CERT_SHA256" ]]
          cd release
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-android-apk
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    if: github.ref_type == 'tag'
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub prerelease and attach the signed assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-android-apk
          path: release
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="drover-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Drover Android $GITHUB_REF_NAME" --prerelease --latest=false \
            --notes 'Sideload the APK, enter the HTTPS address of your Drover server, and sign in. Native push is not included in this preview.' \
            "release/$apk" "release/$apk.sha256"
