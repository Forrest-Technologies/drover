# Categories for GitHub's generated release notes. Pull request titles follow Conventional Commits;
# the label is applied from the title prefix.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: New
      labels: [feat]
    - title: Fixed
      labels: [fix]
    - title: Security
      labels: [security]
    - title: Documentation
      labels: [docs]
    - title: Internal
      labels: ["*"]
