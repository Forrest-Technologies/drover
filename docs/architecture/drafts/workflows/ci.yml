# Draft. Moves to .github/workflows/ci.yml in Phase 0 step 1.
# Builds and tests pull request code, so it must never run on a self-hosted runner
# once the repository is public. The runner is chosen from repository visibility.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    name: Build, format, test
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore Drover.slnx --locked-mode
      - name: Build, warnings are errors
        run: dotnet build Drover.slnx --no-restore -c Release -warnaserror
      - name: Format check
        run: dotnet format Drover.slnx --no-restore --verify-no-changes
      - name: Test (includes row-level security isolation suite on real PostgreSQL)
        run: dotnet test Drover.slnx --no-build -c Release --filter "Category!=Live"
      - name: Vulnerable packages
        run: dotnet list Drover.slnx package --vulnerable --include-transitive
      - name: License check
        run: |
          dotnet tool restore
          dotnet tool run nuget-license -i Drover.slnx -a licenses/allowed.json -ignore licenses/ignored-packages.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

  compose:
    name: Compose builds and starts within budget
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image under the memory budget a small VPS has
        run: |
          start=$(date +%s)
          docker build --memory 2g --memory-swap 2g -t drover:ci .
          echo "build_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          docker image inspect drover:ci --format 'image_bytes={{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Start and wait for health
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl --fail --silent http://localhost:8080/health/ready
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes

  apps:
    name: MAUI shell (Android)
    # Hosted only. Windows packaging runs in release.yml.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build with Apple targets off (DroverEnableApple defaults to false)
        run: dotnet build Drover.Apps.slnx -c Release -f net10.0-android -warnaserror
