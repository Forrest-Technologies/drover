# Draft. Moves to .github/workflows/security.yml in Phase 0 step 1.
# One tool per area, chosen in docs/architecture/10-tooling.md.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: Static analysis (CodeQL)
    # Free on public repositories. Skipped while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp, actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  dependency-review:
    name: New dependencies (vulnerabilities and licenses)
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, PostgreSQL, MS-PL

  secrets:
    name: Leaked secrets (gitleaks)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks CLI, checksum verified
        # The CLI is MIT. Its official action needs a license key for organizations, so the CLI is run directly.
        # GITLEAKS_SHA256 is set in Phase 0 step 1 from the release's checksums file.
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
        env:
          GITLEAKS_SHA256: ${{ vars.GITLEAKS_SHA256 }}
      - name: Scan history
        run: ./gitleaks git --redact --no-banner

  workflows:
    name: Workflow files (zizmor, actionlint)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          persona: pedantic
      - name: actionlint
        # No official action exists. Run the pinned container image by digest; digest set in Phase 0 step 1.
        run: docker run --rm -v "$PWD:/repo" -w /repo "rhysd/actionlint@${ACTIONLINT_DIGEST}" -color
        env:
          ACTIONLINT_DIGEST: ${{ vars.ACTIONLINT_DIGEST }}

  container:
    name: Dockerfile and compose
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: Compose file is valid
        run: docker compose config --quiet
      # Compose hardening rules (no privileged, no host network, no Docker socket, no host mounts,
      # read-only root, dropped capabilities) are asserted by ComposeFileTests in Drover.Server.Tests,
      # which runs in ci.yml. See docs/architecture/10-tooling.md for why no third-party compose scanner is used.
