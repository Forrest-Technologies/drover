# Draft. Moves to .github/dependabot.yml in Phase 0 step 1.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      agent-framework:
        # Tracked at the latest release, previews included. The conformance suite is the gate.
        patterns: ["Microsoft.Agents.*", "Microsoft.Extensions.AI*", "ModelContextProtocol*"]
      microsoft:
        patterns: ["Microsoft.*", "System.*", "Npgsql*"]
        exclude-patterns: ["Microsoft.Agents.*", "Microsoft.Extensions.AI*"]
    ignore:
      # Stay on the .NET 10 LTS line.
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Http*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
