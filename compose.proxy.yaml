# HTTPS in front of Drover, so other devices can reach it. Use it together with compose.yaml:
#
#   DROVER_DOMAIN=drover.example.org docker compose -f compose.yaml -f compose.proxy.yaml up --build
#
# The name must point at this machine, and ports 80 and 443 must reach it, for the proxy to obtain a certificate.
# Put DROVER_DOMAIN in a file named .env beside this one to keep it between runs.
#
# This is an override file rather than a profile because it changes the drover service as well: Drover believes the
# forwarded client address and scheme only from the proxy it names, so the proxy gets a fixed address and Drover is
# told that address. Without it, every person would share the proxy's address for the sign-in limit, and Drover would
# think every request arrived over plain HTTP.

networks:
  default:
    ipam:
      config:
        - subnet: ${DROVER_PROXY_SUBNET:-172.30.80.0/24}

services:
  drover:
    environment:
      DROVER_PUBLIC_URL: https://${DROVER_DOMAIN:?Set DROVER_DOMAIN to the name people open Drover at}
      Drover__Proxy__TrustedAddresses__0: ${DROVER_PROXY_ADDRESS:-172.30.80.250}

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    # Obtains and renews the certificate, redirects HTTP to HTTPS, and sends X-Forwarded-For and X-Forwarded-Proto.
    command: ["caddy", "reverse-proxy", "--from", "${DROVER_DOMAIN}", "--to", "drover:8080"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      default:
        ipv4_address: ${DROVER_PROXY_ADDRESS:-172.30.80.250}
    volumes:
      - drover-proxy-data:/data
      - drover-proxy-config:/config
    depends_on:
      drover:
        condition: service_healthy

volumes:
  drover-proxy-data:
  drover-proxy-config:
